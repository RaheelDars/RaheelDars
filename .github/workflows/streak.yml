name: Update streak

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download streak card
        run: |
          mkdir -p assets
          curl -fsSL --retry 5 --retry-delay 10 "https://streak-stats.demolab.com/?user=RaheelDars&theme=dark&hide_border=true" -o assets/streak.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/streak.svg
          if ! git diff --staged --quiet; then
            git commit -m "update streak"
            git push
          fi